<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar medicamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="buscar_medicamentos.css">
</head>
<body>
    <header class="topo">
        <button class="menu-lateral" type="button" aria-label="Abrir menu">&#9638;</button>
        <a class="logo" href="menu.html">ShareMeds</a>
    </header>

    <main>
        <a class="btn-voltar" href="menu.html">&#8592; Início</a>

        <h1>Buscar medicamento</h1>
        <p class="subtitulo">Encontre medicamentos disponíveis em outros hospitais.</p>

        <form id="formBusca">
            <div class="filtros">
                <div>
                    <label for="nombre">Nome ou princípio ativo</label>
                    <input type="search" id="nombre" name="nombre" placeholder="ex: dipirona">
                </div>
                <div>
                    <label for="validade">Validade Mínima</label>
                    <input type="text" id="validade" name="validade" placeholder="ex: 3 meses">
                </div>
            </div>
        </form>

        <div id="resultado" aria-live="polite"></div>
    </main>

    <script src="buscar_medicamento.js"></script>
</body>
</html>
